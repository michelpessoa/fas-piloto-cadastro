name: CI

on:
  pull_request:
    branches: [develop, main, "release/**"]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: ruff check .
      - run: python -m pytest -q
